<div class="container mt-5">

  <h1 class="text-center mb-5">
    🎬 Portal de Películas
  </h1>

  <div class="row">

    <div
      class="col-md-4 col-lg-3 mb-4"
      *ngFor="let peli of peliculas"
    >

      <div class="card h-100 shadow">

        <img
          [src]="peli.image"
          class="card-img-top"
          alt="pelicula"
        >

        <div class="card-body d-flex flex-column">

          <h5 class="card-title">
            {{ peli.title }}
          </h5>

          <p class="card-text">
            <strong>Año:</strong> {{ peli.year }}
          </p>

          <p class="card-text">
            <strong>Ranking:</strong> {{ peli.rank }}
          </p>

          <p class="card-text">
            {{ peli.description }}
          </p>

        </div>

      </div>

    </div>

  </div>

</div>
