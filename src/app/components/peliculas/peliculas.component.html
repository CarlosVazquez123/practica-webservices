<div class="container mb-5">
  <h2 class="text-center fw-bold mb-4 mt-4 text-primary">Top 100 Películas</h2>
  
  <div class="row g-4">
    @for (pelicula of listaPeliculas; track pelicula.id) {
      <div class="col-12 col-md-6 col-lg-3">
        
        <div class="card h-100 shadow bg-dark text-white border-secondary">
          
          <img [src]="pelicula.image" (error)="pelicula.image = 'https://dummyimage.com/300x450/212529/ffc107&text=Sin+Imagen'"
                class="card-img-top" alt="Poster de {{ pelicula.title }}" style="object-fit: cover; height: 350px;">
          
          <div class="card-body d-flex flex-column">
            <h5 class="card-title text-warning fw-bold">#{{ pelicula.rank }} {{ pelicula.title }}</h5>
            
            <p class="card-text small text-light" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
              {{ pelicula.description }}
            </p>
            
            <div class="mt-auto pt-3 border-top border-secondary d-flex justify-content-between align-items-center">
              <span class="badge bg-warning text-dark fs-6">
                <i class="bi bi-star-fill"></i> {{ pelicula.rating }}
              </span>
              <span class="badge bg-secondary fs-6">{{ pelicula.year }}</span>
            </div>
          </div>
          
        </div>
      </div>
    } @empty {
      <div class="col-12 text-center mt-5">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
        <h5 class="mt-3 text-muted">Descargando cartelera...</h5>
      </div>
    }
  </div>
</div>
