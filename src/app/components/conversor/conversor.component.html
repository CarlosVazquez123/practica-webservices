<div class="container mt-5 mb-5 d-flex justify-content-center">
  <div class="card shadow-lg border-secondary" style="max-width: 500px; width: 100%;">
    
    <div class="card-header bg-success text-white text-center py-3">
      <h3 class="mb-0 fw-bold"><i class="bi bi-currency-exchange me-2"></i>Conversor de Divisas</h3>
    </div>
    
    <div class="card-body bg-dark text-white p-4">
      
      <div class="mb-4">
        <label class="form-label text-warning fw-bold">Monto Origen:</label>
        <div class="input-group input-group-lg">
          
          <select class="form-select border-secondary bg-secondary text-white fw-bold" style="max-width: 130px;" 
                  [(ngModel)]="monedaOrigen" 
                  (change)="calcularConversion()">
            @for (moneda of listaMonedas; track $index) {
              <option [value]="moneda">{{ moneda }}</option>
            }
          </select>
          
          <input type="number" class="form-control" 
                 [(ngModel)]="cantidadOrigen" 
                 (input)="calcularConversion()" min="0">
        </div>
      </div>

      <div class="text-center mb-4">
        <i class="bi bi-arrow-down-up fs-2 text-success"></i>
      </div>

      <div class="mb-4">
        <label class="form-label text-warning fw-bold">Monto Destino:</label>
        <div class="input-group input-group-lg">
          
          <select class="form-select border-secondary bg-secondary text-white fw-bold" style="max-width: 130px;" 
                  [(ngModel)]="monedaDestino" 
                  (change)="calcularConversion()">
            @for (moneda of listaMonedas; track $index) {
              <option [value]="moneda">{{ moneda }}</option>
            }
          </select>
          
          <input type="number" class="form-control bg-light fw-bold text-dark" 
                 [value]="cantidadDestino.toFixed(2)" readonly>
        </div>
      </div>

      @if (cargando) {
        <div class="text-center text-muted small mt-3">
          <div class="spinner-border spinner-border-sm text-success me-2" role="status"></div>
          Conectando con Wall Street...
        </div>
      } @else {
        <div class="text-center text-success small mt-3 fw-semibold">
          <i class="bi bi-check-circle me-1"></i> Tipos de cambio actualizados
        </div>
      }

    </div>
  </div>
</div>
